apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: nginx-app
  namespace: flux-system
spec:
  image: ghcr.io/jsakilesh/devops-homelab
  interval: 1m0s
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: nginx-app
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nginx-app
  policy:
    semver:
      range: '>=1.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImageUpdateAutomation
metadata:
  name: nginx-app
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: devops-homelab
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@jsakilesh.dev
        name: Flux Bot
      messageTemplate: 'chore(image): update {{ .AutomationObject.Name }} to {{ .NewValue }}'
    push:
      branch: main
  update:
    path: ./kubernetes
    strategy: Setters