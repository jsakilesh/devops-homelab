apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devops-homelab
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./kubernetes
  prune: true
  sourceRef:
    kind: GitRepository
    name: devops-homelab
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: nginx-app
      namespace: production
  timeout: 2m0s
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: devops-homelab
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/jsakilesh/devops-homelab