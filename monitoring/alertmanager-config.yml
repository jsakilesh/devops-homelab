apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: homelab-alertmanager
  namespace: monitoring
spec:
  route:
    groupBy: ["alertname", "namespace", "severity"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: slack-warning
    routes:
      - matchers:
          - name: severity
            value: critical
        receiver: slack-critical
        repeatInterval: 1h
        continue: false
      - matchers:
          - name: severity
            value: warning
        receiver: slack-warning
        repeatInterval: 4h
        continue: false
      - matchers:
          - name: alertname
            value: Watchdog
        receiver: blackhole

  receivers:
    - name: blackhole

    - name: slack-warning
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-secret
            key: webhook-url
          channel: "#devops-alerts"
          sendResolved: true
          iconEmoji: ":warning:"
          title: "⚠️ [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
          text: |
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Namespace:* {{ .Labels.namespace }}
            *Severity:* {{ .Labels.severity }}
            {{ end }}

    - name: slack-critical
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-secret
            key: webhook-url
          channel: "#devops-critical"
          sendResolved: true
          iconEmoji: ":rotating_light:"
          title: "🚨 CRITICAL: {{ .GroupLabels.alertname }}"
          text: |
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Namespace:* {{ .Labels.namespace }}
            {{ end }}