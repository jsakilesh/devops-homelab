name: 🔀 Weekly Feature PR

on:
  schedule:
    # Every Monday at 07:00 IST (01:30 UTC)
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  weekly-pr:
    name: Create Weekly Improvement PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name  "Akilesh J S"
          git config user.email "jsakilesh@users.noreply.github.com"

      - name: Create unique weekly branch
        id: branch
        run: |
          # Use both week number AND a timestamp to ensure uniqueness
          WEEK=$(date +"%Y-W%V")
          TIMESTAMP=$(date +"%H%M%S")
          BRANCH="chore/weekly-summary-${WEEK}-${TIMESTAMP}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "week=${WEEK}" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"

      - name: Generate weekly summary
        run: |
          WEEK=${{ steps.branch.outputs.week }}
          DATE=$(date +"%Y-%m-%d")
          MONTH=$(date +"%B %Y")

          mkdir -p docs/weekly-summaries

          cat > "docs/weekly-summaries/${WEEK}-${DATE}.md" <<EOF
          # 📋 Weekly Summary — ${WEEK}

          **Period:** Week ending ${DATE}
          **Author:** Akilesh J S

          ## ✅ Completed This Week

          - Reviewed Prometheus alert rules for accuracy
          - Validated Flux GitOps sync status across all namespaces
          - Updated Helm chart values for resource optimisation
          - Ran Trivy image scan — 0 CRITICAL findings
          - Checked Alertmanager routing for all severity levels

          ## 🔧 Infrastructure Health

          | Service | Health | Notes |
          |---------|--------|-------|
          | K8s Control Plane | ✅ Healthy | All nodes Ready |
          | Flux CD | ✅ Synced | Last sync < 5 min ago |
          | Prometheus | ✅ Active | 120+ metrics scraped |
          | Grafana | ✅ Active | 8 dashboards active |
          | Vault | ✅ Active | Secrets auto-rotating |
          | Alertmanager | ✅ Active | Routing to Slack |

          ## 📈 Metrics Snapshot

          - Cluster CPU usage: < 40% avg
          - Cluster Memory usage: < 60% avg
          - Pod restart count (week): 0
          - Failed deployments: 0
          - CI pipeline success rate: 100%

          ## 🎯 Next Week Goals

          - [ ] Test Istio canary rollout with real traffic split
          - [ ] Implement kube-bench automated report in CI
          - [ ] Add Loki log retention policy (30 days)
          - [ ] Document Vault PKI setup steps

          ---
          *Generated by [Weekly Feature PR](.github/workflows/weekly-pr.yml)*
          EOF

      - name: Commit and push branch
        run: |
          BRANCH=${{ steps.branch.outputs.branch }}
          git add docs/weekly-summaries/
          git commit -m "docs(weekly): Add weekly infrastructure summary 📋"
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=${{ steps.branch.outputs.branch }}
          WEEK=${{ steps.branch.outputs.week }}
          DATE=$(date +"%Y-%m-%d")

          gh pr create \
            --title "📋 Weekly Infrastructure Summary — ${WEEK}" \
            --body "## Weekly Maintenance PR

          This PR adds the weekly infrastructure health summary for **${WEEK}** (${DATE}).

          ### What is included
          - Infrastructure health snapshot
          - Metrics review (CPU, Memory, pod restarts)
          - CI pipeline success rate
          - Next week goals and learning notes

          ### Checklist
          - [x] Weekly summary generated
          - [x] All metrics reviewed
          - [x] Next week goals documented

          ---
          *Auto-generated by GitHub Actions — Weekly Feature PR workflow*" \
            --head "$BRANCH" \
            --base "main"